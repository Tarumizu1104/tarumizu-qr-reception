
<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>垂水進学塾 QR受付テスト</title>
  <script src="https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.js"></script>
  <style>
    body {
      font-family: sans-serif;
      text-align: center;
      background: #f4f7fb;
      padding: 15px;
    }
    h2 { color: #174c82; }
    video {
      width: 100%;
      max-width: 420px;
      border-radius: 12px;
      background: #222;
    }
    button {
      font-size: 20px;
      padding: 14px 24px;
      margin: 15px;
    }
    #result {
      font-size: 22px;
      font-weight: bold;
      margin-top: 20px;
    }
  </style>
</head>
<body>
  <h2>垂水進学塾</h2>
  <h3>QR入退室受付・読み取りテスト</h3>
  <p>QRカードをカメラにかざしてください</p>

  <button id="start">カメラ起動</button>
  <video id="video" autoplay playsinline muted></video>
  <canvas id="canvas" hidden></canvas>
  <p id="result" aria-live="polite">読み取り待機中</p>

  <script>
    const video = document.getElementById("video");
    const canvas = document.getElementById("canvas");
    const ctx = canvas.getContext("2d", {
      willReadFrequently: true
    });
    const result = document.getElementById("result");
    let scanning = false;
    let lastText = "";
    let lastTime = 0;

    document.getElementById("start").onclick = async () => {
      try {
        if (typeof jsQR !== "function") {
          result.textContent = "QR解析ライブラリを読み込めません";
          return;
        }

        const stream = await navigator.mediaDevices.getUserMedia({
          audio: false,
          video: { facingMode: { ideal: "environment" } }
        });

        video.srcObject = stream;
        await video.play();
        scanning = true;
        result.textContent = "読み取り待機中";
        requestAnimationFrame(scan);
      } catch (error) {
        result.textContent = "カメラエラー: " + error.message;
      }
    };

    function scan() {
      if (!scanning) return;

      if (video.readyState >= 2 &&
          video.videoWidth > 0 &&
          video.videoHeight > 0) {

        canvas.width = video.videoWidth;
        canvas.height = video.videoHeight;
        ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
        if (!lastText) {
  result.textContent = "映像解析中: " + canvas.width + "×" + canvas.height;
}

        const image = ctx.getImageData(
          0, 0, canvas.width, canvas.height
        );

        const code = jsQR(
          image.data,
          image.width,
          image.height,
          { inversionAttempts: "attemptBoth" }
        );

        if (code) {
          const now = Date.now();
          if (code.data !== lastText || now - lastTime > 3000) {
            lastText = code.data;
            lastTime = now;
            
result.textContent = "QRコードを読み取りました。生徒情報を確認してください";
console.log("QR読み取り成功（文字数）:", code.data.length);
          }
        }
      }

      requestAnimationFrame(scan);
    }
  </script>
</body>
</html>
